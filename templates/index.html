<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamRip Pro - Facebook Downloader</title><style>*{box-sizing:border-box}body{margin:0;background:#020b18;color:#f2f7ff;font:16px system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:32px 18px}h1{color:#18bde3;font-size:32px}h2{font-size:23px}.muted{color:#9cacbe}.panel{background:#0c1629;border:1px solid #184263;border-radius:22px;padding:25px;margin-top:25px}input{background:#050e1e;color:white;border:1px solid #24506e;padding:17px;border-radius:12px;width:100%;font-size:16px}button,.download{border:0;border-radius:12px;background:#079bcc;color:white;font-weight:700;padding:15px 20px;cursor:pointer;font-size:16px}.download{display:inline-block;text-decoration:none}button:disabled{opacity:.5}.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.row button{flex:1}#formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:15px}#formats button{background:#112b44;border:1px solid #24506e}#thumb{max-width:100%;max-height:310px;border-radius:15px}#message{white-space:pre-wrap;line-height:1.5}.error{color:#ff7676}progress{width:100%;height:20px}footer{text-align:center;margin:40px 0;color:#8c9cae}</style></head><body><main class="wrap"><h1>⚡ StreamRip <small>PRO</small></h1><h2>Facebook वीडियो और Reels डाउनलोडर</h2><p class="muted">उपलब्ध वास्तविक क्वालिटी में MP4 वीडियो और MP3 ऑडियो</p><section class="panel"><label for="url">Facebook वीडियो या Reel का लिंक</label><input id="url" type="url" placeholder="https://www.facebook.com/..." autocomplete="off"><div class="row"><button id="paste" type="button">पेस्ट</button><button id="analyze" type="button">विश्लेषण करें</button></div><p id="message" role="status"></p></section><section id="result" class="panel" hidden><img id="thumb" alt="वीडियो थंबनेल"><h2 id="title"></h2><p id="author" class="muted"></p><div id="formats"></div></section><section id="jobPanel" class="panel" hidden><h2>डाउनलोड प्रगति</h2><progress id="progress" value="0" max="100"></progress><p id="jobText"></p><a id="fileLink" class="download" hidden>फ़ाइल डाउनलोड करें</a></section><footer>केवल अपनी या डाउनलोड की अनुमति वाली सामग्री के लिए</footer></main><script>
const $=id=>document.getElementById(id);let sourceUrl='';const say=(s,bad=false)=>{$('message').textContent=s;$('message').className=bad?'error':''};async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'सर्वर त्रुटि');return d} $('paste').onclick=async()=>{try{$('url').value=await navigator.clipboard.readText()}catch{say('लिंक को बॉक्स में पेस्ट करें।',true)}};
$('analyze').onclick=async()=>{let url=$('url').value.trim();$('result').hidden=true;$('jobPanel').hidden=true;if(!/^https:\/\/(?:[\w-]+\.)?(?:facebook\.com|fb\.watch)\//i.test(url)){say('मान्य Facebook लिंक डालें।',true);return} $('analyze').disabled=true;say('वीडियो की जानकारी प्राप्त की जा रही है…');try{const d=await post('/api/analyze',{url});const m=d.metadata;sourceUrl=m.sourceUrl;$('title').textContent=m.title||'Facebook वीडियो';$('author').textContent=m.author||'';$('thumb').hidden=!m.thumbnail;if(m.thumbnail)$('thumb').src=m.thumbnail;const area=$('formats');area.replaceChildren();for(const f of m.formats||[]){const b=document.createElement('button');b.textContent=f.qualityLabel+(f.ext?' · '+f.ext.toUpperCase():'');b.onclick=()=>download(f);area.append(b)}$('result').hidden=false;say(area.children.length?'अपनी पसंदीदा क्वालिटी चुनें।':'इस वीडियो के लिए डाउनलोड क्वालिटी उपलब्ध नहीं है।')}catch(e){say(e.message,true)}finally{$('analyze').disabled=false}};
async function download(f){$('jobPanel').hidden=false;$('fileLink').hidden=true;$('progress').value=0;$('jobText').textContent='डाउनलोड शुरू हो रहा है…';try{const d=await post('/api/download',{url:sourceUrl,formatId:f.formatId,isAudio:f.ext==='mp3'});for(let i=0;i<360;i++){await new Promise(r=>setTimeout(r,1000));const response=await fetch('/api/job/'+encodeURIComponent(d.jobId));const state=await response.json();if(!state.success)throw Error(state.error||'जॉब नहीं मिला');const j=state.job;$('progress').value=j.progressPercent||0;$('jobText').textContent=(j.progressPercent||0)+'% · '+(j.speedFormatted||'')+' · '+j.status;if(j.status==='completed'){$('fileLink').href='/api/file/'+encodeURIComponent(d.jobId);$('fileLink').hidden=false;$('fileLink').click();return}if(j.status==='error')throw Error(j.error||'डाउनलोड विफल')}throw Error('डाउनलोड में अधिक समय लग रहा है।')}catch(e){$('jobText').textContent=e.message}}
</script></body></html>
