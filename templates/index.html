<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020b18"><title>StreamRip PRO - Facebook Video & Reels Downloader</title><meta name="description" content="Facebook वीडियो और Reels के लिए उपलब्ध MP4 और MP3 डाउनलोड विकल्प।"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#003044 0,#020b18 45%);color:#f2f7ff;font:16px system-ui,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:30px 18px}h1{color:#18bde3;font-size:clamp(26px,5vw,36px);margin:12px 0}h1 small{font-size:14px;border-radius:20px;background:#073c50;padding:5px 10px}h2{font-size:clamp(21px,4vw,28px)}.muted{color:#9cacbe}.panel{background:#0c1629;border:1px solid #184263;border-radius:22px;padding:clamp(16px,4vw,25px);margin-top:25px}label{display:block;margin-bottom:12px}input{background:#050e1e;color:white;border:1px solid #24506e;padding:17px;border-radius:12px;width:100%;font-size:16px;min-width:0}button,.download{border:0;border-radius:12px;background:#079bcc;color:white;font-weight:700;padding:15px 20px;cursor:pointer;font-size:16px}.download{display:inline-block;text-decoration:none}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.row button{flex:1;min-width:120px}#formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:15px}#formats button{background:#112b44;border:1px solid #24506e;min-height:75px}#formats button:hover{border-color:#18bde3}#thumb{display:block;max-width:100%;max-height:330px;object-fit:contain;border-radius:15px}#message{white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.error{color:#ff7676}progress{width:100%;height:20px;accent-color:#09b6d6}footer{text-align:center;margin:40px 0;color:#8c9cae}#description{white-space:pre-wrap;overflow-wrap:anywhere}.secondary{background:#223249}#fileLink{margin-top:12px}a{color:#7bdcff}[hidden]{display:none!important}
</style></head><body><main class="wrap"><h1>⚡ StreamRip <small>PRO</small></h1><h2>Facebook वीडियो और Reels डाउनलोडर</h2><p class="muted">उपलब्ध वास्तविक क्वालिटी में MP4 वीडियो और MP3 ऑडियो</p><section class="panel"><label for="url">Facebook वीडियो या Reel का लिंक</label><input id="url" type="url" placeholder="https://www.facebook.com/..." autocomplete="off" inputmode="url"><div class="row"><button id="paste" type="button" class="secondary">पेस्ट</button><button id="analyze" type="button">विश्लेषण करें</button></div><p id="message" role="status" aria-live="polite"></p></section><section id="result" class="panel" hidden><img id="thumb" alt="वीडियो थंबनेल" hidden><h2 id="title"></h2><p id="author" class="muted"></p><p id="description" class="muted" hidden></p><button id="more" class="secondary" type="button" hidden>और पढ़ें</button><div id="formats"></div></section><section id="jobPanel" class="panel" hidden><h2>डाउनलोड प्रगति</h2><progress id="progress" value="0" max="100"></progress><p id="jobText" role="status" aria-live="polite"></p><a id="fileLink" class="download" hidden>फ़ाइल डाउनलोड करें</a></section><footer>केवल अपनी या डाउनलोड की अनुमति वाली सामग्री के लिए</footer></main><script>
'use strict';
const $=id=>document.getElementById(id);let sourceUrl='',busy=false,description='';
const say=(s,bad=false)=>{$('message').textContent=s;$('message').className=bad?'error':''};
function validFacebook(url){try{const u=new URL(url);return u.protocol==='https:'&&!u.username&&!u.password&&u.port===''&&['facebook.com','www.facebook.com','m.facebook.com','web.facebook.com','fb.watch','www.fb.watch'].includes(u.hostname.toLowerCase())}catch{return false}}
async function jsonResponse(response){let data;try{data=await response.json()}catch{throw Error('सर्वर से सही JSON उत्तर नहीं मिला।')}if(!response.ok||data.success===false)throw Error(data.error||'सर्वर त्रुटि ('+response.status+')');return data}
async function post(path,body){return jsonResponse(await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}))}
$('paste').onclick=async()=>{try{$('url').value=await navigator.clipboard.readText();say('')}catch{say('लिंक बॉक्स को दबाकर Paste करें।',true)}};
$('more').onclick=()=>{const expanded=$('more').dataset.expanded==='true';$('more').dataset.expanded=String(!expanded);$('description').textContent=expanded?description.slice(0,220)+'…':description;$('more').textContent=expanded?'और पढ़ें':'कम दिखाएँ'};
$('analyze').onclick=async()=>{const url=$('url').value.trim();$('result').hidden=true;$('jobPanel').hidden=true;sourceUrl='';if(!validFacebook(url)){say('केवल मान्य HTTPS Facebook वीडियो या Reels लिंक डालें।',true);return}$('analyze').disabled=true;say('वीडियो की जानकारी प्राप्त की जा रही है…');try{const d=await post('/api/analyze',{url});const m=d.metadata||{};sourceUrl=m.sourceUrl||url;$('title').textContent=m.title||'Facebook वीडियो';$('author').textContent=m.author||'';$('thumb').hidden=!m.thumbnail;if(m.thumbnail)$('thumb').src=m.thumbnail;description=String(m.description||'');$('description').hidden=!description;$('more').hidden=description.length<=220;$('more').dataset.expanded='false';$('more').textContent='और पढ़ें';$('description').textContent=description.length>220?description.slice(0,220)+'…':description;const area=$('formats');area.replaceChildren();for(const f of m.formats||[]){if(!f.formatId)continue;const b=document.createElement('button');b.type='button';b.textContent=String(f.qualityLabel||'वीडियो')+(f.ext?' · '+String(f.ext).toUpperCase():'');b.onclick=()=>download(f);area.append(b)}$('result').hidden=false;say(area.children.length?'अपनी पसंदीदा क्वालिटी चुनें।':'इस वीडियो के लिए डाउनलोड क्वालिटी उपलब्ध नहीं है।')}catch(e){say(e.message||'विश्लेषण विफल',true)}finally{$('analyze').disabled=false}};
async function download(f){if(busy)return;busy=true;$('jobPanel').hidden=false;$('fileLink').hidden=true;$('progress').value=0;$('jobText').textContent='डाउनलोड शुरू हो रहा है…';try{const d=await post('/api/download',{url:sourceUrl,formatId:f.formatId,isAudio:f.ext==='mp3'});if(!d.jobId)throw Error('सर्वर से Job ID नहीं मिला।');for(let i=0;i<360;i++){await new Promise(r=>setTimeout(r,1000));let response;try{response=await fetch('/api/job/'+encodeURIComponent(d.jobId),{cache:'no-store'})}catch{if(i<359)continue;throw Error('सर्वर से संपर्क नहीं हो सका।')}const state=await jsonResponse(response);const j=state.job||{};const pct=Math.max(0,Math.min(100,Number(j.progressPercent)||0));$('progress').value=pct;$('jobText').textContent=pct+'% · '+(j.speedFormatted||'')+' · '+(j.status||'');if(j.status==='completed'){const link=$('fileLink');link.href='/api/file/'+encodeURIComponent(d.jobId);link.hidden=false;$('jobText').textContent='फ़ाइल तैयार है। नीचे बटन दबाकर डाउनलोड करें।';return}if(j.status==='error')throw Error(j.error||'डाउनलोड विफल')}throw Error('डाउनलोड में अधिक समय लग रहा है। बाद में दोबारा प्रयास करें।')}catch(e){$('jobText').textContent=e.message||'डाउनलोड विफल'}finally{busy=false}}
</script></body></html>
