<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Video Downloader</title><style>
*{box-sizing:border-box}body{margin:0;background:#061426;color:#eef6ff;font:16px system-ui,sans-serif}.wrap{max-width:660px;margin:25px auto;padding:28px 22px;background:#10263e;border:1px solid #31516b;border-radius:24px}h1{font-size:clamp(24px,5vw,32px);margin:0 0 15px}p{color:#b9ccdf;line-height:1.7}label{display:block;font-weight:700;margin:20px 0 10px}input,select,button{width:100%;font:inherit;padding:16px;border-radius:13px}input,select{background:#071d30;color:white;border:1px solid #53708b}button{background:#28d3ad;color:#052b2b;font-weight:800;border:0;margin-top:15px;cursor:pointer}button:disabled{opacity:.55}#result{margin-top:20px}#message{margin-top:18px;color:#ffd38c;white-space:pre-wrap}img{max-width:100%;max-height:260px;border-radius:12px}small{color:#a9bed0;line-height:1.6;display:block;margin-top:24px}a{color:#61e8c9}
</style></head><body><main class="wrap"><h1>▶️ YouTube Video Downloader</h1><p>केवल YouTube और YouTube Shorts के वीडियो लिंक डालें। उपलब्ध क्वालिटी चुनकर MP4 तैयार करें।</p><label for="url">YouTube वीडियो लिंक</label><input id="url" type="url" placeholder="https://www.youtube.com/shorts/..." autocomplete="off"><button id="search">🔍 वीडियो खोजें</button><div id="message" role="status"></div><div id="result" hidden><h2 id="title"></h2><img id="thumb" alt="वीडियो थंबनेल" hidden><label for="quality">वीडियो क्वालिटी</label><select id="quality"></select><button id="merge">⬇️ MP4 तैयार करें</button><div id="download"></div></div><small>मुफ्त सर्वर पर 150 MB और अधिकतम 20 मिनट की सीमा है। YouTube कुछ सर्वर अनुरोध ब्लॉक कर सकता है। केवल अपने या अनुमति प्राप्त वीडियो डाउनलोड करें।</small></main><script>
const $=id=>document.getElementById(id);let source='',videos=[];
async function post(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let json;try{json=await res.json()}catch{throw Error('सर्वर से सही जवाब नहीं मिला।')}if(!res.ok)throw Error(json.error||'अनुरोध असफल');return json}
$('search').onclick=async()=>{$('result').hidden=true;$('message').textContent='वीडियो की जानकारी खोजी जा रही है…';$('search').disabled=true;try{const data=await post('/api/inspect',{url:$('url').value.trim()});source=data.source;videos=data.videos||[];$('title').textContent=data.title;$('quality').replaceChildren(...videos.map(v=>{const o=document.createElement('option');o.value=v.format_id;o.textContent=v.label;return o}));$('thumb').hidden=!data.thumbnail;if(data.thumbnail)$('thumb').src=data.thumbnail;$('download').replaceChildren();$('result').hidden=false;$('message').textContent='वीडियो मिल गया। क्वालिटी चुनें।'}catch(e){$('message').textContent='समस्या: '+e.message}finally{$('search').disabled=false}};
$('merge').onclick=async()=>{$('merge').disabled=true;$('message').textContent='MP4 तैयार किया जा रहा है, कृपया प्रतीक्षा करें…';$('download').replaceChildren();try{const data=await post('/api/merge',{source,format_id:$('quality').value});const a=document.createElement('a');a.href=data.download;a.textContent='⬇️ MP4 डाउनलोड करें';a.setAttribute('download','youtube-video.mp4');$('download').append(a);$('message').textContent='वीडियो तैयार है। डाउनलोड लिंक 10 मिनट तक उपलब्ध रहेगा।'}catch(e){$('message').textContent='समस्या: '+e.message}finally{$('merge').disabled=false}};
</script></body></html>
