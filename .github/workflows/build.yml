
name: StreamRip Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build
              - name: Check yt-dlp files
        run: |
          ls -lh yt-dlp yt-dlp_bin 2>&1 || true
          python3 -m yt_dlp --version || true
  
