
name: StreamRip Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
 - name: Make yt-dlp executable
        run: |
          chmod +x yt-dlp
          ./yt-dlp --version

      - name: Check yt-dlp files
        run: |
          echo "Checking yt-dlp file..."
          ls -lh yt-dlp
          
          echo "Checking yt-dlp file..."
          ls -lh yt-dlp

          echo "Checking Python yt-dlp..."
          python3 -m yt_dlp --version

          echo "Checking FFmpeg..."
          ffmpeg -version | head -n 1

          echo "Checking FFprobe..."
          ffprobe -version | head -n 1

      - name: Validate Python code
        run: |
          python3 -m py_compile app.py
          python3 -m py_compile video_processor.py

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: streamrip-frontend
          path: dist/
          if-no-files-found: error
          
