<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101f"><title>StreamRip Pro | Facebook Downloader</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101f;color:#f0f7ff;font:16px system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:25px 16px 60px}.brand{font-size:27px;font-weight:850;color:#20c7e6}h1{font-size:clamp(26px,6vw,38px);margin:26px 0 8px}h2{font-size:21px;margin:0 0 20px}.muted{color:#9fb4c9;line-height:1.55}.card{background:linear-gradient(150deg,#122940,#0b172a);border:1px solid #28516d;border-radius:22px;padding:22px;margin-top:23px}label{display:block;font-weight:700;margin-bottom:12px}input{width:100%;padding:16px;background:#071525;color:white;border:1px solid #38627b;border-radius:13px;font-size:16px}button,.save{border:0;border-radius:13px;padding:15px 12px;background:linear-gradient(110deg,#078dd9,#0fc5ce);color:#041421;font-size:16px;font-weight:800;cursor:pointer}.secondary{background:#263d56;color:#fff}.row{display:flex;gap:10px;margin-top:13px}.row button{flex:1}button:disabled{opacity:.5;cursor:wait}#formats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#formats button{min-height:86px;background:#16344c;border:1px solid #2d6580;color:#fff;overflow-wrap:anywhere}#formats button.selected{border-color:#13d7dc;background:#15516b}progress{width:100%;height:18px;accent-color:#10c6d6}#stats{display:flex;justify-content:space-between;gap:10px;color:#b3c8da;margin-top:10px}.save{display:block;text-align:center;text-decoration:none;margin-top:14px}.error{color:#ff858c}.success{color:#57e5ae}#message,#jobText{overflow-wrap:anywhere;line-height:1.5}.toast{position:fixed;bottom:20px;left:16px;right:16px;max-width:620px;margin:auto;background:#105847;color:white;border-radius:14px;padding:16px;box-shadow:0 8px 25px #0009;z-index:10}footer{text-align:center;margin-top:35px;color:#8ca2b7;font-size:13px}[hidden]{display:none!important}@media(max-width:390px){.card{padding:16px}#formats{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">⚡ StreamRip <small>PRO</small></div><h1>Facebook वीडियो और Reels डाउनलोडर</h1><p class="muted">लिंक डालें, उपलब्ध क्वालिटी चुनें और MP4 या MP3 डाउनलोड करें।</p>
<section class="card"><label for="url">Facebook वीडियो या Reel लिंक</label><input id="url" type="url" placeholder="https://www.facebook.com/share/r/..." autocomplete="off"><div class="row"><button class="secondary" id="paste" type="button">पेस्ट करें</button><button id="analyze" type="button">विश्लेषण करें</button></div><p id="message" role="status" aria-live="polite"></p></section>
<section class="card" id="result" hidden><h2>उपलब्ध क्वालिटी</h2><div id="formats"></div></section>
<section class="card" id="jobPanel" hidden><h2>डाउनलोड स्थिति</h2><progress id="progress" value="0" max="100"></progress><div id="stats"><span id="percent">0%</span><span id="speed">0 KB/s</span></div><p id="jobText" aria-live="polite"></p><p id="size" class="muted"></p><a id="fileLink" class="save" hidden>⬇ डाउनलोड फिर से खोलें</a></section><footer>केवल अपनी या डाउनलोड की अनुमति वाली सामग्री के लिए।</footer></main><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let sourceUrl='',busy=false,activeJob='',toastTimer;
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const mb=n=>(Number(n||0)/1048576).toFixed(2)+' MB';
const fmtSpeed=n=>n>=1048576?(n/1048576).toFixed(2)+' MB/s':(n/1024).toFixed(1)+' KB/s';
function say(s,bad=false){$('message').textContent=s;$('message').className=bad?'error':'success'}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,6500)}
function validFacebook(url){try{const u=new URL(url);return u.protocol==='https:'&&!u.username&&!u.password&&['facebook.com','www.facebook.com','m.facebook.com','web.facebook.com','fb.watch','www.fb.watch'].includes(u.hostname.toLowerCase())}catch{return false}}
async function api(path,options={}){let response;try{response=await fetch(path,{cache:'no-store',credentials:'same-origin',...options})}catch{throw Error('NETWORK: इंटरनेट या सर्वर से संपर्क नहीं हो पाया।')}let raw;try{raw=await response.text()}catch{throw Error('NETWORK: सर्वर का उत्तर पढ़ा नहीं जा सका।')}let data;try{data=JSON.parse(raw)}catch{throw Error('SERVER_RESPONSE: सर्वर से मान्य JSON नहीं मिला (HTTP '+response.status+').')}if(!response.ok||data.success===false){const error=new Error(data.error||('HTTP '+response.status));error.status=response.status;throw error}return data}
const post=(path,data)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
$('paste').onclick=async()=>{try{$('url').value=await navigator.clipboard.readText()}catch{say('लिंक बॉक्स को दबाकर पेस्ट करें।',true)}};
$('analyze').onclick=async()=>{if(busy){say('पहले चल रहा डाउनलोड पूरा होने दें।',true);return}const url=$('url').value.trim();if(!validFacebook(url)){say('केवल मान्य HTTPS Facebook वीडियो या Reel लिंक डालें।',true);return}sourceUrl='';$('result').hidden=true;$('jobPanel').hidden=true;$('analyze').disabled=true;say('उपलब्ध क्वालिटी देखी जा रही है…');try{const data=await post('/api/analyze',{url});const formats=data.metadata?.formats||[];sourceUrl=data.metadata?.sourceUrl||url;const area=$('formats');area.replaceChildren();for(const f of formats){if(!f||!f.formatId)continue;const button=document.createElement('button');button.type='button';button.textContent=String(f.qualityLabel||'क्वालिटी')+' · '+String(f.ext||'mp4').toUpperCase();button.onclick=()=>download(f,button);area.append(button)}$('result').hidden=false;say(area.children.length?'डाउनलोड शुरू करने के लिए क्वालिटी चुनें।':'कोई उपलब्ध क्वालिटी नहीं मिली।',!area.children.length)}catch(e){say(e.message,true)}finally{$('analyze').disabled=false}};
let audioContext=null;
function unlockSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){audioContext ||=new AC();audioContext.resume().catch(()=>{})}}catch{}}
function completionSignal(){toast('✅ फ़ाइल सर्वर पर तैयार है। मोबाइल डाउनलोड शुरू किया जा रहा है।');try{navigator.vibrate?.([150,80,150]);if(audioContext){const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.value=880;g.gain.value=.06;o.start();o.stop(audioContext.currentTime+.18)}}catch{}if('Notification'in window&&Notification.permission==='granted'){try{new Notification('StreamRip: फ़ाइल तैयार है',{body:'मोबाइल डाउनलोड शुरू किया जा रहा है।'})}catch{}}}
function autoSave(url){const a=document.createElement('a');a.href=url;a.download='';a.style.display='none';document.body.append(a);a.click();a.remove()}
async function download(f,button){if(busy)return;unlockSound();busy=true;button.classList.add('selected');$('analyze').disabled=true;document.querySelectorAll('#formats button').forEach(b=>b.disabled=true);$('jobPanel').hidden=false;$('fileLink').hidden=true;$('size').textContent='';$('progress').value=0;$('percent').textContent='0%';$('speed').textContent='0 KB/s';$('jobText').textContent='डाउनलोड शुरू हो रहा है…';$('jobPanel').scrollIntoView({behavior:'smooth',block:'center'});
try{const isAudio=String(f.ext).toLowerCase()==='mp3';const start=await post('/api/download',{url:sourceUrl,formatId:f.formatId,isAudio});if(!start.jobId)throw Error('सर्वर ने Job ID नहीं दी।');activeJob=start.jobId;let temporaryFailures=0;let lastPercent=0;
for(let i=0;i<900;i++){await sleep(1500);let state;try{state=await api('/api/job/'+encodeURIComponent(activeJob));temporaryFailures=0}catch(e){if(e.status===404){throw Error('डाउनलोड जॉब सर्वर पर नहीं मिली। Render Restart या अलग Worker के कारण ऐसा हो सकता है; Backend में साझा Job Storage आवश्यक है।')}if(++temporaryFailures<=5){$('jobText').textContent='सर्वर से दोबारा संपर्क हो रहा है ('+temporaryFailures+'/5)…';continue}throw e}
const j=state.job||{};const completed=j.status==='completed';const pct=completed?100:Math.min(99,Math.max(0,Number(j.progressPercent)||0));lastPercent=Math.max(lastPercent,pct);$('progress').value=lastPercent;$('percent').textContent=lastPercent+'%';$('speed').textContent=j.speedFormatted||fmtSpeed(Number(j.speedBytesPerSecond)||0);const names={starting:'तैयारी हो रही है…',downloading:'डाउनलोड हो रहा है…',processing:'वीडियो और ऑडियो जोड़े जा रहे हैं…',verifying:'फ़ाइल सत्यापित की जा रही है…',converting:'MP4 तैयार हो रहा है…'};$('jobText').textContent=names[j.status]||j.status||'स्थिति जाँची जा रही है…';if(j.status==='error'||j.status==='failed')throw Error(j.error||'डाउनलोड या फ़ाइल सत्यापन विफल हुआ।');if(completed){const fileUrl='/api/file/'+encodeURIComponent(activeJob);$('jobText').textContent='✅ सर्वर पर फ़ाइल तैयार है। मोबाइल में डाउनलोड शुरू किया जा रहा है।';$('size').textContent=Number(j.fileSizeBytes)>0?'फ़ाइल साइज: '+mb(j.fileSizeBytes):'फ़ाइल का साइज सर्वर से उपलब्ध नहीं है।';$('fileLink').href=fileUrl;$('fileLink').hidden=false;completionSignal();autoSave(fileUrl);return}}
throw Error('डाउनलोड की समय सीमा समाप्त हुई। सर्वर की स्थिति जाँचें।')
}catch(e){$('jobText').textContent='❌ '+e.message;toast('❌ '+e.message)}finally{busy=false;$('analyze').disabled=false;document.querySelectorAll('#formats button').forEach(b=>{b.disabled=false;b.classList.remove('selected')})}}
</script></body></html>
