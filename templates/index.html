<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Video Downloader</title><style>*{box-sizing:border-box}body{margin:0;background:#071424;color:#edf8ff;font:16px system-ui}main{max-width:650px;margin:35px auto;padding:24px;border-radius:22px;background:#10253c;border:1px solid #365a73}h1{font-size:26px}p{line-height:1.6;color:#c6d8e7}input,select,button,a.download{width:100%;display:block;padding:15px;margin:10px 0 18px;border-radius:12px;font-size:16px}input,select{background:#081b2b;color:white;border:1px solid #54748a}button,a.download{background:#2ad6ad;color:#05251f;border:0;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}button:disabled{opacity:.5}label{font-weight:700}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffda95}.hidden{display:none}small{color:#a6bfce}img{max-width:100%;border-radius:14px;max-height:260px;object-fit:contain}@media(max-width:680px){main{margin:12px;padding:18px}}</style></head><body><main><h1>🎬 Social Video Downloader</h1><p>अनुमति प्राप्त YouTube, Facebook या Instagram वीडियो लिंक डालें। उपलब्ध क्वालिटी चुनें और MP4 तैयार करें।</p><label for="url">वीडियो शेयर लिंक</label><input id="url" type="url" placeholder="https://youtu.be/..."/><button id="search">🔍 वीडियो खोजें</button><div id="status" role="status"></div><section id="choices" class="hidden"><h3 id="title"></h3><img id="thumb" alt="वीडियो प्रीव्यू" referrerpolicy="no-referrer" style="display:none"><label for="video">वीडियो क्वालिटी</label><select id="video"></select><button id="merge">⬇️ MP4 तैयार करें</button></section><div id="result"></div><p><small>मुफ्त सर्वर पर 150 MB की सीमा और अधिकतम 20 मिनट का परीक्षण संस्करण। कुछ वीडियो स्रोत सर्वर से डाउनलोड रोक सकते हैं। केवल अपने या अनुमति प्राप्त वीडियो डाउनलोड करें।</small></p></main><script>
const $=id=>document.getElementById(id);let source='',formats=[];function status(t){$('status').textContent=t}function option(sel,label,value){const o=document.createElement('option');o.textContent=label;o.value=value;sel.append(o)}
$('search').onclick=async()=>{status('वीडियो जानकारी प्राप्त कर रहे हैं...');$('choices').classList.add('hidden');$('result').replaceChildren();$('search').disabled=true;try{const r=await fetch('/api/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Server error');source=d.source;formats=d.formats;$('title').textContent=d.title;$('video').replaceChildren();d.videos.forEach(x=>option($('video'),x.label,x.index));$('thumb').style.display=d.thumbnail?'block':'none';if(d.thumbnail)$('thumb').src=d.thumbnail;$('choices').classList.remove('hidden');status(`${d.platform}: ${d.videos.length} क्वालिटी मिलीं।`)}catch(e){status('समस्या: '+e.message)}finally{$('search').disabled=false}};
$('merge').onclick=async()=>{status('वीडियो डाउनलोड और MP4 प्रोसेसिंग जारी है। इसमें समय लग सकता है...');$('merge').disabled=true;$('result').replaceChildren();try{const r=await fetch('/api/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,format_id:formats[Number($('video').value)]})});const d=await r.json();if(!r.ok)throw Error(d.error||'Download failed');const a=document.createElement('a');a.className='download';a.href=d.download;a.textContent='⬇️ MP4 डाउनलोड करें';$('result').append(a);status('MP4 तैयार है। डाउनलोड करें।')}catch(e){status('समस्या: '+e.message)}finally{$('merge').disabled=false}};
</script></body></html>
