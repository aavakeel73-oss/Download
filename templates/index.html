<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101f"><title>StreamRip Pro | Facebook Downloader</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12415a,#06101f 55%);color:#eff7ff;font:16px system-ui,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:28px 16px 70px}.brand{font-size:28px;font-weight:900;color:#2dd4ee}h1{font-size:clamp(27px,6vw,42px);margin:30px 0 8px}p{line-height:1.5}.muted{color:#a0b5ca}.card{background:linear-gradient(150deg,#122940,#0b172a);border:1px solid #2b506a;border-radius:23px;padding:23px;margin-top:24px;box-shadow:0 14px 40px #0003}label{display:block;font-weight:700;margin-bottom:12px}input{width:100%;background:#071525;color:white;border:1px solid #38627b;border-radius:14px;padding:17px;font-size:16px;outline:none}input:focus{border-color:#23d4e4}.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}button,.save{border:0;border-radius:13px;padding:16px 13px;background:linear-gradient(110deg,#078dd9,#0fc5ce);color:#041421;font-size:16px;font-weight:800;cursor:pointer;text-align:center}.secondary{background:#263d56;color:white}button:disabled{opacity:.5;cursor:wait}.error{color:#ff858c}.success{color:#57e5ae}#formats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}#formats button{background:#16344c;color:#f2f9ff;border:1px solid #2d6580;min-height:90px;overflow-wrap:anywhere}#formats button:active{background:#17688a}#thumb{max-width:100%;max-height:190px;border-radius:13px;object-fit:cover}#title{font-size:19px;overflow-wrap:anywhere}progress{width:100%;height:17px;accent-color:#10c6d6}#stats{display:flex;justify-content:space-between;color:#b3c8da;margin-top:10px}.save{display:block;text-decoration:none;margin-top:15px}.hidden,[hidden]{display:none!important}footer{text-align:center;color:#829ab0;margin-top:38px;font-size:13px}.toast{position:fixed;bottom:18px;left:15px;right:15px;max-width:600px;margin:auto;padding:18px;background:#0d5948;color:#fff;border-radius:14px;box-shadow:0 6px 24px #0009;z-index:10}@media(max-width:380px){.card{padding:16px}#formats{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">⚡ StreamRip <small>PRO</small></div><h1>Facebook वीडियो और Reels डाउनलोडर</h1><p class="muted">उपलब्ध वास्तविक क्वालिटी चुनें और MP4 वीडियो या MP3 ऑडियो डाउनलोड करें।</p><section class="card"><label for="url">Facebook वीडियो या Reel लिंक</label><input id="url" type="url" placeholder="https://www.facebook.com/share/r/..." autocomplete="off"><div class="row"><button class="secondary" id="paste">पेस्ट करें</button><button id="analyze">विश्लेषण करें →</button></div><p id="message" role="status" aria-live="polite"></p></section><section class="card" id="result" hidden><h2>उपलब्ध क्वालिटी</h2><div id="preview" hidden><img id="thumb" alt="वीडियो थंबनेल"><p id="title"></p></div><div id="formats"></div></section><section class="card" id="jobPanel" hidden><h2>डाउनलोड स्थिति</h2><progress id="progress" value="0" max="100"></progress><div id="stats"><span id="percent">0%</span><span id="speed">0 KB/s</span></div><p id="jobText" aria-live="polite"></p><p id="size" class="muted"></p><a id="fileLink" class="save" hidden>⬇ फ़ाइल डाउनलोड करें</a></section><footer>केवल अपनी या डाउनलोड की अनुमति वाली सामग्री के लिए।</footer></main><div id="toast" class="toast" role="status" hidden></div><script>
const $=id=>document.getElementById(id);let sourceUrl='',activeJob='',polling=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const mb=n=>(Number(n||0)/1048576).toFixed(2)+' MB';const speed=n=>n>=1048576?(n/1048576).toFixed(2)+' MB/s':(n/1024).toFixed(1)+' KB/s';function say(t,bad=false){$('message').textContent=t;$('message').className=bad?'error':'success'}function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,7000)}
async function api(path,opts={}){let r;try{r=await fetch(path,{cache:'no-store',...opts})}catch{throw Error('सर्वर से संपर्क नहीं हो पाया। इंटरनेट या Render सेवा जाँचें।')}const body=await r.text();let data;try{data=JSON.parse(body)}catch{throw Error(r.status>=500?'सर्वर अस्थायी रूप से अनुपलब्ध है (HTTP '+r.status+').':'सर्वर से JSON की जगह खाली/HTML जवाब मिला (HTTP '+r.status+').')}if(!r.ok||data.success===false)throw Error(data.error||'HTTP '+r.status);return data}
const post=(path,data)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
$('paste').onclick=async()=>{try{$('url').value=await navigator.clipboard.readText()}catch{say('लिंक बॉक्स में लंबे समय तक दबाकर पेस्ट करें।',true)}};
$('analyze').onclick=async()=>{if(polling){say('पहले चल रहा डाउनलोड पूरा होने दें।',true);return}const url=$('url').value.trim();if(!/^https:\/\//i.test(url)){say('मान्य Facebook HTTPS लिंक डालें।',true);return}$('result').hidden=true;$('jobPanel').hidden=true;$('analyze').disabled=true;say('वीडियो की जानकारी निकाली जा रही है…');try{const data=await post('/api/analyze',{url});sourceUrl=url;const m=data.metadata||{};$('title').textContent=(m.title||'').slice(0,130);$('preview').hidden=!(m.thumbnail||m.title);$('thumb').hidden=!m.thumbnail;if(m.thumbnail)$('thumb').src=m.thumbnail;const area=$('formats');area.replaceChildren();for(const f of m.formats||[]){const b=document.createElement('button');b.textContent=f.qualityLabel+' · '+f.ext.toUpperCase();b.onclick=()=>download(f);area.append(b)}$('result').hidden=false;say(area.children.length?'क्वालिटी चुनकर डाउनलोड शुरू करें।':'इस वीडियो के लिए कोई डाउनलोड योग्य फ़ॉर्मेट नहीं मिला।')}catch(e){say(e.message,true)}finally{$('analyze').disabled=false}};
function notify(){toast('✅ वीडियो फ़ाइल तैयार है! मोबाइल डाउनलोड शुरू किया जा रहा है।');try{if(navigator.vibrate)navigator.vibrate([180,90,180]);const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.07;o.start();o.stop(c.currentTime+.17);o.onended=()=>c.close()}}catch{}}
function autoSave(url){const a=document.createElement('a');a.href=url;a.download='';a.style.display='none';document.body.append(a);a.click();a.remove()}
async function download(f){if(polling)return;polling=true;$('jobPanel').hidden=false;$('fileLink').hidden=true;$('size').textContent='';$('progress').value=0;$('percent').textContent='0%';$('jobText').textContent='डाउनलोड शुरू हो रहा है…';$('jobPanel').scrollIntoView({behavior:'smooth',block:'center'});try{const data=await post('/api/download',{url:sourceUrl,formatId:f.formatId});activeJob=data.jobId;let failures=0;for(let i=0;i<900;i++){await sleep(1500);let state;try{state=await api('/api/job/'+encodeURIComponent(activeJob));failures=0}catch(e){if(++failures<=5){$('jobText').textContent='सर्वर से दोबारा संपर्क किया जा रहा है…';continue}throw e}const j=state.job||{};const pct=j.progressPercent||0;$('progress').value=pct;$('percent').textContent=pct+'%';$('speed').textContent=speed(j.speedBytesPerSecond||0);const names={starting:'तैयारी हो रही है…',downloading:'वीडियो डाउनलोड हो रहा है…',processing:'वीडियो और ऑडियो जोड़े जा रहे हैं…',verifying:'फ़ाइल सत्यापित हो रही है…',converting:'मोबाइल के लिए MP4 तैयार हो रहा है…'};$('jobText').textContent=names[j.status]||j.status||'';if(j.status==='error')throw Error(j.error||'डाउनलोड विफल हुआ।');if(j.status==='completed'){$('jobText').textContent='✅ सर्वर पर फ़ाइल तैयार है। मोबाइल में सेव करना शुरू किया जा रहा है।';$('size').textContent='वास्तविक फ़ाइल साइज: '+mb(j.fileSizeBytes);const url='/api/file/'+encodeURIComponent(activeJob);$('fileLink').href=url;$('fileLink').hidden=false;notify();autoSave(url);return}}throw Error('डाउनलोड में बहुत समय लग रहा है।')}catch(e){$('jobText').textContent='❌ '+e.message;toast('डाउनलोड विफल: '+e.message)}finally{polling=false}}
</script></body></html>
